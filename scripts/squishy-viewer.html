<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Squishy sculpt review</title><style>
body{margin:0;background:#f5eee8;color:#584637;font:15px system-ui}canvas{width:100vw;height:100vh;display:block;touch-action:none}nav{position:absolute;left:22px;top:22px;right:22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:#fff8ee;border:1px solid #d8c7b4;border-radius:24px;padding:10px 16px;min-height:44px;cursor:pointer}h1{margin:0 12px 0 0;font:700 19px system-ui}p{position:absolute;bottom:14px;left:22px;right:22px;text-align:center;font-size:13px;color:#806d5e;pointer-events:none}
</style><canvas id="view"></canvas><nav><h1>Little dumpling studio</h1><select id="friend" aria-label="Choose squishy"></select><button id="bao">Squishy</button><button id="basket">Steamer</button><button id="lid">Open / close</button><button id="squish">Squish!</button><button id="turn">Turntable</button><a href="/scripts/squishy-gallery.html" style="color:inherit;padding:10px">All squishies</a></nav><p>Drag to turn · Sculpted dough, satin finish, glossy eyes & a woven bamboo steamer</p><script type="module">
import * as pc from 'playcanvas';import {loadSquishyArt,animateSquishy} from '/src/game/SquishyArt.ts';import {createDumpling,createBlindBox} from '/src/game/dumplingVisual.ts';import {DUMPLINGS} from '/src/data/collection.ts';
const app=new pc.Application(document.querySelector('canvas'),{graphicsDeviceOptions:{antialias:true,alpha:true}});app.graphicsDevice.maxPixelRatio=1.75;app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);app.scene.ambientLight=new pc.Color(.7,.68,.65);
const camera=new pc.Entity();camera.addComponent('camera',{projection:pc.PROJECTION_ORTHOGRAPHIC,toneMapping:pc.TONEMAP_ACES,orthoHeight:1.05,clearColor:new pc.Color(.94,.91,.88)});app.root.addChild(camera);camera.setPosition(.20,1.18,3.5);camera.lookAt(0,.45,0);
const resize=()=>{app.resizeCanvas();camera.camera.orthoHeight=innerWidth<innerHeight?1.02/(innerWidth/innerHeight):1.05;};addEventListener('resize',resize);resize();
for(const [power,pitch,yaw] of [[.88,38,-35],[.40,25,65],[.6,55,180]]){const light=new pc.Entity();light.addComponent('light',{type:'directional',color:new pc.Color(1,.98,.96),intensity:power,castShadows:power===.88,shadowResolution:1024,shadowDistance:8,shadowBias:.12,normalOffsetBias:.025});light.setEulerAngles(pitch,yaw,0);app.root.addChild(light);}
const floor=new pc.Entity();floor.addComponent('render',{type:'plane'});floor.setLocalScale(100,1,100);floor.setLocalPosition(0,-.012,0);const mat=new pc.StandardMaterial();mat.diffuse=new pc.Color().fromString('#f4eee9');mat.gloss=.1;mat.update();floor.render.material=mat;app.root.addChild(floor);
await loadSquishyArt(app);let current=createDumpling(app,app.root,DUMPLINGS[0]),mode='bao',opened=false,spin=false,time=0,press=-10;const basket=createBlindBox(app,app.root);basket.root.enabled=false;
const select=document.querySelector('#friend');for(const d of DUMPLINGS){const option=document.createElement('option');option.value=d.id;option.textContent=d.name+' · '+d.rarity;select.append(option);}select.onchange=()=>{current.destroy();current=createDumpling(app,app.root,DUMPLINGS.find(d=>d.id===select.value));mode='bao';current.enabled=true;basket.root.enabled=false;frameObject();};
document.querySelector('#bao').onclick=()=>{mode='bao';current.enabled=true;basket.root.enabled=false;frameObject();};document.querySelector('#basket').onclick=()=>{mode='basket';current.enabled=false;basket.root.enabled=true;frameObject();};document.querySelector('#lid').onclick=()=>{document.querySelector('#basket').click();opened=!opened;};document.querySelector('#turn').onclick=()=>spin=!spin;document.querySelector('#squish').onclick=()=>{document.querySelector('#bao').click();press=time;};
function frameObject(){camera.camera.orthoHeight=innerWidth<innerHeight?1.02/(innerWidth/innerHeight):mode==='basket'?1.15:1.05;if(mode==='basket'){camera.setPosition(.9,1.75,3.5);camera.lookAt(0,.72,0);}else{camera.setPosition(.20,1.18,3.5);camera.lookAt(0,.45,0);}}addEventListener('resize',frameObject);
let pointer=null,yaw=0;document.querySelector('canvas').onpointerdown=e=>{pointer=e.clientX;e.target.setPointerCapture(e.pointerId);};document.querySelector('canvas').onpointermove=e=>{if(pointer!==null){yaw+=(e.clientX-pointer)*.4;pointer=e.clientX;}};document.querySelector('canvas').onpointerup=()=>pointer=null;
let portraitMode=false,lid=0;app.on('update',dt=>{time+=Math.min(dt,.05);if(spin)yaw+=dt*20;current.setEulerAngles(0,yaw,0);basket.root.setEulerAngles(0,yaw,0);animateSquishy(current,time,portraitMode?0:.012);const t=time-press;if(t<.85){const y=1-.24*Math.sin(t/.85*Math.PI)*Math.exp(-t*1.5);current.setLocalScale(1/Math.sqrt(y),y,1/Math.sqrt(y));}lid+=((opened?-112:0)-lid)*(1-Math.exp(-6*dt));basket.lid.setLocalEulerAngles(lid,0,0);});app.start();
window.squishyReview={app,select(id){select.value=id;select.onchange();},portrait(){portraitMode=true;spin=false;yaw=0;floor.enabled=false;camera.camera.clearColor=new pc.Color(0,0,0,0);camera.camera.orthoHeight=DUMPLINGS.find(d=>d.id===select.value)?.special?.includes('bunny')?.84:DUMPLINGS.find(d=>d.id===select.value)?.special?.includes('unicorn')?.80:.64;camera.setPosition(0,1.03,3.1);camera.lookAt(0,DUMPLINGS.find(d=>d.id===select.value)?.special?.match(/bunny|unicorn/)? .65:.48,0);document.body.style.background='transparent';},materials(){return current.findComponents('render').flatMap(r=>r.meshInstances.map(m=>({name:m.material.name,color:m.material.diffuse.toString(),roughness:m.material.gloss,coat:m.material.clearCoat,map:m.material.diffuseMap?.name})));},view(x,y,z){camera.setPosition(x,y,z);camera.lookAt(0,.46,0);},turn(degrees){yaw=degrees;},basket(open){document.querySelector('#basket').click();opened=open;},ready:true};
const requested=new URLSearchParams(location.search).get('id');if(DUMPLINGS.some(d=>d.id===requested))window.squishyReview.select(requested);
</script></html>
